
name: Build Forge 1.20.1 mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build
        run: gradle build --stacktrace --no-daemon

      - name: Upload compiled jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wendaopetals-forge-1.20.1-0.1.0
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload compile error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: build/reports/**
          if-no-files-found: ignore
